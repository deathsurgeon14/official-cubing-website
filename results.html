<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — FKS Cubing Open 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --paper:#F6F4EF;
    --paper-dim:#EAE7DD;
    --cube-red:#E6402A;
    --line:#D9D5C8;
    --text-dim:#6B7280;
    --qualify-green:#1F9D55;
    --qualify-bg:#E6F5EC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px;}

  /* ---------- NAV ---------- */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(246,244,239,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1120px;margin:0 auto;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em;}
  .logo-mark{
    height:36px;width:auto;flex-shrink:0;
  }
  footer .logo-mark{
    filter:brightness(0) invert(1);
  }
  .nav-links{display:flex;align-items:center;gap:28px;font-size:14.5px;font-weight:500;}
  .nav-links .active{position:relative;}
  .nav-links .active::after{
    content:"";position:absolute;left:0;right:0;bottom:-19px;height:2px;background:var(--ink);
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
    border:1px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(18,23,43,0.3);}
  .btn-outline{border-color:var(--ink);}
  .btn-solid-red{background:var(--cube-red);color:#fff;}
  .btn-solid-red:hover{box-shadow:0 6px 16px rgba(230,64,42,0.35);}
  .nav-cta{display:flex;gap:10px;align-items:center;}
  .results-caret{font-size:11px;opacity:.6;margin-left:2px;}

  /* ---------- PAGE HEADER ---------- */
  .page-header{
    background:radial-gradient(120% 140% at 15% 0%, #202749 0%, var(--ink) 55%, #0C1022 100%);
    color:var(--paper);padding:48px 0 36px;
  }
  .header-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;}
  .header-left{display:flex;align-items:center;gap:16px;}
  .event-badge{
    width:52px;height:52px;border-radius:13px;background:var(--cube-red);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#fff;
  }
  .event-badge svg{display:block;}
  .page-header h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);}
  .page-header .sub{color:rgba(246,244,239,0.65);font-size:14px;margin-top:4px;}
  .event-nav{display:flex;gap:8px;flex-wrap:wrap;}
  .event-pill{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 14px;border-radius:999px;
    border:1px solid rgba(246,244,239,0.25);color:rgba(246,244,239,0.65);cursor:pointer;
    background:transparent;
  }
  .event-pill.current{background:var(--cube-red);border-color:var(--cube-red);color:#fff;}
  .live-badge{
    display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    font-weight:600;color:var(--cube-red);background:rgba(230,64,42,0.12);padding:4px 10px;border-radius:999px;
    margin-left:10px;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--cube-red);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}

  /* ---------- ROUND TABS ---------- */
  .results-section{padding:40px 0 24px;}
  .age-group-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .agegroup-pill{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);color:var(--text-dim);cursor:pointer;background:#fff;
  }
  .agegroup-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .round-tabs{display:flex;gap:8px;margin-bottom:26px;border-bottom:1px solid var(--line);}
  .round-tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    padding:11px 6px;color:var(--text-dim);cursor:pointer;position:relative;background:none;border:none;
    margin-right:22px;
  }
  .round-tab.active{color:var(--ink);}
  .round-tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--cube-red);
  }

  /* ---------- ADVANCEMENT NOTE ---------- */
  .advance-note{
    display:none;align-items:center;gap:8px;margin:-10px 0 14px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--qualify-green);font-weight:600;
  }
  .advance-note .swatch{width:12px;height:12px;border-radius:3px;background:var(--qualify-bg);border:2px solid var(--qualify-green);}

  /* ---------- TABLE ---------- */
  .results-table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--text-dim);padding:13px 16px;border-bottom:1
