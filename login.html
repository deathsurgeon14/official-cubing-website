<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FKS Cubing Open 2026 — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12172B;
    --paper: #F6F4EF;
    --cube-red: #E6402A;
    --line: #D9D5C8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* NAV */
  nav {
    position:sticky;top:0;z-index:50;
    background:rgba(246,244,239,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner {
    max-width:1120px;margin:0 auto;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo { display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em; }
  .logo-mark { height:36px;width:auto;flex-shrink:0; }
  footer .logo-mark { filter:brightness(0) invert(1); }
  .nav-links { display:flex;align-items:center;gap:28px;font-size:14.5px;font-weight:500; }
  .nav-links .active { position:relative; }
  .nav-links .active::after {
    content:"";position:absolute;left:0;right:0;bottom:-19px;height:2px;background:var(--ink);
  }
  .btn {
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
    border:1px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform:translateY(-1px); }
  .btn-primary { background:var(--ink);color:var(--paper); }
  .btn-primary:hover { box-shadow:0 6px 16px rgba(18,23,43,0.3); }
  .btn-outline { border-color:var(--ink); }
  .btn-solid-red { background:var(--cube-red);color:#fff; }
  .btn-solid-red:hover { box-shadow:0 6px 16px rgba(230,64,42,0.35); }
  .nav-cta { display:flex;gap:10px;align-items:center; }
  .results-caret { font-size:11px;opacity:.6;margin-left:2px; }

  /* LOGIN FORM */
  .wrap { max-width: 1120px; margin: 40px auto; padding: 0 28px; flex: 1; }
  .login-card {
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 8px; }
  .notice { font-size: 13px; color: var(--cube-red); font-weight: 600; margin-bottom: 20px; }
  
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .form-group input:focus { outline: 2px solid var(--ink); }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    margin-top: 8px;
  }
  
  #login-error {
    color: var(--cube-red);
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
    font-weight: 500;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <img class="logo-mark" src="FKS Logo.png" alt="FKS Logo">
      FKS Cubing Open
    </div>
    <div class="nav-links">
      <a href="index">Home</a>
      <a href="competitions">Competitions</a>      
      <a href="schedule">Schedule</a>
      <a href="overview">Overview</a>
      <a href="results">Results</a>
      <a href="#" class="active">Login</a>
    </div>
    <div class="nav-cta">
      <a href="registration.html" class="btn btn-solid-red">Register</a>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="login-card">
    <h1 class="card-title">Login</h1>
    <p class="notice">Login for Admins Only</p>

    <!-- WRAPPED FORM & ADDED IDS -->
    <form id="login-form">
      <div id="login-error">Invalid Username or Password</div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>
</div>

</html>
